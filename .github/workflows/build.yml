name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in Directory.Build.props"
          }

      - name: Restore
        run: dotnet restore ReaperStudio.sln

      - name: Build
        run: dotnet build ReaperStudio.sln -c Release --no-restore

      - name: Test
        run: dotnet test ReaperStudio.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish app
        run: dotnet publish src/ReaperStudio/ReaperStudio.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ReaperStudio-win-x64
          path: publish/
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ReaperStudio-win-x64
          path: ReaperStudio

      - name: Zip
        run: zip -r "ReaperStudio-${{ github.ref_name }}-win-x64.zip" ReaperStudio

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "ReaperStudio-${{ github.ref_name }}-win-x64.zip" \
            --repo "${{ github.repository }}" \
            --title "Reaper Studio ${{ github.ref_name }}" \
            --generate-notes \
            --notes "Unzip and run \`ReaperStudio.exe\`. Requires Windows 10 (1803+) or 11 and the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0). Close the original CZC app first."
